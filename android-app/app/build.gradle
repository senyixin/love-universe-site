plugins {
    id "com.android.application"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def configuredServerUrl = (project.findProperty("serverUrl") ?: "http://10.0.2.2:5173").toString()
def escapedServerUrl = configuredServerUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
def configuredGetuiAppId = (project.findProperty("getuiAppId") ?: System.getenv("GETUI_APP_ID") ?: "hDksxQhiF59e2aFsYnaQf7").toString()
def escapedGetuiAppId = configuredGetuiAppId
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.senyixin.loveuniverse"
    compileSdk 35

    defaultConfig {
        applicationId "com.senyixin.loveuniverse"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${escapedServerUrl}\""
        buildConfigField "String", "GETUI_APP_ID", "\"${escapedGetuiAppId}\""
        manifestPlaceholders = [
                GETUI_APPID: configuredGetuiAppId
        ]
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.getui:gtsdk:3.3.13.0"
    implementation "com.getui:gtc:3.3.1.0"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}
