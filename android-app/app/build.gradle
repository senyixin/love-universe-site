plugins {
    id "com.android.application"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def configuredServerUrl = (project.findProperty("serverUrl") ?: "http://10.0.2.2:5173").toString()
def escapedServerUrl = configuredServerUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "com.senyixin.loveuniverse"
    compileSdk 35

    defaultConfig {
        applicationId "com.senyixin.loveuniverse"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${escapedServerUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}
